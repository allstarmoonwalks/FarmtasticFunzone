<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sign your agreement — Farmtastic FunZone</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml"><link rel="icon" href="/favicon.ico?v=2" sizes="any">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cream:#fbf3e0;--ink:#2b200a;--barn:#a8321f;--wood:#6b4a2b;--line:#d9c9a0}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--wood);color:#fff;padding:12px 16px}main{padding:16px;max-width:820px;margin:auto}
.paper{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.box{background:#fff;border:2px solid var(--barn);border-radius:10px;padding:16px;margin-bottom:24px}
input[type=text]{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:4px 0 10px}
label{font-weight:600;font-size:14px}button{background:var(--barn);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:700;cursor:pointer}
button.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}.err{color:var(--barn)}.muted{color:#7a6a45;font-size:14px}
@media print{header,.noprint{display:none}body{background:#fff}.paper{border:0;padding:0}}
</style></head><body>
<header><b>🌾 Farmtastic FunZone</b> · Agreement</header>
<main id="view"><p class="muted">Loading your agreement…</p></main>
<script src="../shared/supabase-config.js"></script>
<script src="../shared/contract.js"></script>
<script>
const CFG=window.FARM_CONFIG, sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token=new URLSearchParams(location.search).get('t'), view=document.getElementById('view');
const css=document.createElement('style');css.textContent=ContractDoc.CSS;document.head.appendChild(css);
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function show(c){
  const signed=c.status==='signed';
  view.innerHTML=`<h2 style="margin-top:0">${esc(c.title)}</h2>
   ${signed?'':'<p>Please read the agreement below. When you are ready, type your name at the bottom to sign it.</p>'}
   <div class="paper" id="doc">${c.body_html}</div>
   ${signed?ContractDoc.signedBlock(c)+'<p class="noprint"><button class="alt" onclick="print()">Print / save as PDF</button></p>':`
   <div class="box noprint"><h3 style="margin-top:0">Sign this agreement</h3>
   <label for="nm">Your full name</label><input type="text" id="nm" autocomplete="name">
   <label for="ti">Your title (optional)</label><input type="text" id="ti" placeholder="e.g. Fair Manager" autocomplete="organization-title">
   <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400;margin:6px 0 12px"><input type="checkbox" id="ag" style="margin-top:4px"> <span>I have read and agree to this agreement. Typing my name is my legal signature, the same as signing on paper.</span></label>
   <p id="er" class="err"></p><button id="go" onclick="sign()">Sign agreement</button></div>`}`;
  const sg=document.querySelector('[data-sig]');if(sg&&c.signed_name)sg.innerHTML=`<i style="font:italic 20px Georgia,serif">${esc(c.signed_name)}</i>`;
}
async function load(){
  if(!UUID.test(token||'')){view.innerHTML='<p class="err">This signing link is not valid. Please use the link from your email.</p>';return}
  const {data,error}=await sb.rpc('get_contract',{p_token:token});
  if(error||!data){view.innerHTML='<p class="err">This agreement could not be found, or it is no longer open for signing. Please contact us at 936-223-1433.</p>';return}
  show(data);
}
async function sign(){
  const nm=document.getElementById('nm').value.trim(), er=document.getElementById('er');er.textContent='';
  if(nm.length<2){er.textContent='Please type your full name.';return}
  if(!document.getElementById('ag').checked){er.textContent='Please check the box to agree.';return}
  const b=document.getElementById('go');b.disabled=true;b.textContent='Signing…';
  const {error}=await sb.rpc('sign_contract',{p_token:token,p_name:nm,p_title:document.getElementById('ti').value.trim()||null,p_agent:navigator.userAgent});
  if(error){er.textContent=error.message;b.disabled=false;b.textContent='Sign agreement';return}
  await load();window.scrollTo(0,0);
  view.insertAdjacentHTML('afterbegin','<p class="noprint" style="background:#eef6ea;border:2px solid #3f6b2f;border-radius:8px;padding:12px"><b>Thank you!</b> Your signed agreement is saved. We will be in touch about the retainer invoice.</p>');
}
load();
</script></body></html>
