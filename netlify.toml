# Netlify config for a static (no-build) site.
# Site files live at the repo root, so there's nothing to compile.
[build]
  publish = "."
  command = ""

# CRM + crew app: never index, never frame.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Cache-Control = "no-cache"
[[headers]]
  for = "/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
