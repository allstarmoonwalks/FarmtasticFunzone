<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Farmtastic CRM</title>
<link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml"><link rel="icon" href="/favicon.ico?v=2" sizes="any">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cream:#fbf3e0;--cream2:#f1e4c3;--ink:#2b200a;--barn:#a8321f;--green:#3f6b2f;--gold:#d99a1e;--wood:#6b4a2b;--line:#d9c9a0}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,sans-serif;background:var(--cream);color:var(--ink)}
header{background:var(--wood);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}header button{background:none;border:1px solid #fff8;color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}
nav{display:flex;gap:4px;padding:8px 20px;background:var(--cream2);flex-wrap:wrap}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
nav button.on{background:var(--barn);color:#fff}
main{padding:20px;max-width:1200px;margin:auto}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{font-size:28px;display:block}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--cream2);font-size:12px;text-transform:uppercase}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--cream2)}
.new{background:#fde2dc}.contacted{background:#fff0c2}.quoted{background:#dcebf9}.won,.confirmed,.completed{background:#d8ecd0}.lost,.cancelled{background:#e6e0d4}.tentative{background:#fff0c2}
button.p{background:var(--barn);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600}
button.s{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
input,select,textarea{font:inherit;padding:7px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 3px}
.row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
dialog{border:0;border-radius:12px;max-width:820px;width:94%;padding:20px}dialog::backdrop{background:#0006}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cal-h{background:var(--cream2);font-size:11px;font-weight:700;text-align:center;padding:4px 0;text-transform:uppercase}
.cal-d{background:#fff;min-height:84px;padding:3px;overflow:hidden;min-width:0}.cal-d.off{background:#f6efdc}.cal-d.today{outline:2px solid var(--gold);outline-offset:-2px}
.cal-d .n{font-size:12px;color:#7a6a45}.chip{font-size:11px;border-radius:4px;padding:1px 4px;margin-top:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:620px){.cal-d{min-height:56px}.chip{font-size:10px}}
.tog button{border-radius:0}.tog button:first-child{border-radius:8px 0 0 8px}.tog button:last-child{border-radius:0 8px 8px 0}.tog .on{background:var(--barn);color:#fff}
.login{max-width:340px;margin:12vh auto}.muted{color:#7a6a45;font-size:13px}.err{color:var(--barn)}
</style></head><body>
<div id="gate"></div>
<div id="app" hidden>
<header><h1>🌾 Farmtastic Fun Zone CRM</h1><span id="who" class="muted" style="color:#fff9"></span><button onclick="openChangePassword()">Change password</button><button onclick="signOut()">Sign out</button></header>
<nav id="nav"></nav><main id="view"></main>
<style id="ccss"></style><dialog id="dlg"></dialog>
</div>
<script src="../shared/supabase-config.js"></script>
<script src="../shared/pricing.js"></script>
<script src="../shared/schedule.js"></script>
<script src="../shared/contract.js"></script>
<script src="../shared/contract-import.js"></script>
<script src="../shared/crm-core.js"></script>
<script>
let TABS=['Dashboard','Leads','Customers','Events','Quotes','Contracts','Invoices','Tasks'];
let filt={};
let tab='Dashboard', ME=null, attractions=[];
const $=id=>document.getElementById(id);
const pill=s=>`<span class="pill ${esc(s)}">${esc(s)}</span>`;
const q=async(p)=>{const {data,error}=await p;if(error){alert(error.message);return[]}return data||[]};

async function boot(){
  const r=await requireStaff();
  if(!r||r.error==='config'){
    $('gate').innerHTML=`<form class="login card" onsubmit="doLogin(event)"><h2>Staff sign in</h2>
      ${r?.error==='config'?'<p class="err">Supabase isn\'t configured yet. Fill in shared/supabase-config.js.</p>':''}
      <label>Email</label><input id="em" type="email" required><label>Password</label><input id="pw" type="password" required>
      <p id="lerr" class="err">${esc(urlAuthError)}</p><button class="p">Sign in</button> <button type="button" class="s" onclick="doReset()">Forgot / set password</button></form>`;return;}
  if(r.error==='not-staff'){$('gate').innerHTML=`<div class="login card"><h2>No staff access</h2><p>${esc(r.user.email)} isn't an active employee. Ask an admin to add you.</p><button class="s" onclick="signOut()">Sign out</button></div>`;return;}
  ME=r.employee;if(ME.role==='admin'&&!TABS.includes('Team')){TABS.splice(TABS.indexOf('Invoices')+1,0,'Financials');TABS.push('Team')}$('gate').innerHTML='';$('app').hidden=false;$('who').textContent=ME.name+' ('+ME.role+')';
  attractions=await q(sb.from('attractions').select('*').order('sort'));
  // The database price list is the source of truth for quotes (falls back to shared/pricing.js if it can't load).
  const [tiers,pset]=await Promise.all([q(sb.from('price_tiers').select('*')),q(sb.from('settings').select('value').eq('key','pricing'))]);
  tiers.forEach(t=>{if(FarmPricing.GRID[t.length_band])FarmPricing.GRID[t.length_band][t.booths]=+t.per_day});
  const ps=pset[0]&&pset[0].value;if(ps){const D=FarmPricing.DEFAULTS;if(ps.craft_addon_short_per_day!=null)D.craftShortPerDay=+ps.craft_addon_short_per_day;if(ps.craft_addon_long_flat!=null)D.craftLongFlat=+ps.craft_addon_long_flat;if(ps.long_event_min_days!=null)D.longMinDays=+ps.long_event_min_days;if(ps.deposit_pct!=null)D.depositPct=+ps.deposit_pct}
  $('nav').innerHTML=TABS.map(t=>`<button data-t="${t}" onclick="go('${t}')">${t}</button>`).join('');go(tab);
}
async function doReset(){try{await resetPassword($('em').value);$('lerr').style.color='#3f6b2f';$('lerr').textContent='Check your email for a link.'}catch(x){$('lerr').textContent=x.message}}
async function doLogin(e){e.preventDefault();try{await signIn($('em').value,$('pw').value);location.reload()}catch(x){$('lerr').textContent=x.message}}
function go(t){tab=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({Dashboard,Leads,Customers,Events,Quotes,Contracts,Invoices,Tasks,Team,Financials})[t]()}
function goF(t,f){filt={...f};go(t)}

async function Dashboard(){
  const today=new Date().toISOString().slice(0,10);
  const [leads,events,inv,tasks,qs,cons]=await Promise.all([q(sb.from('leads').select('status')),q(sb.from('events').select('*, event_staff(employee_id, employees(name))').gte('end_date',today).neq('status','cancelled').order('start_date').limit(8)),q(sb.from('invoices').select('amount,status')),q(sb.from('tasks').select('id').eq('done',false)),q(sb.from('quotes').select('status')),q(sb.from('contracts').select('status'))]);
  const n=s=>leads.filter(l=>l.status===s).length, owed=inv.filter(i=>i.status==='unpaid').reduce((a,i)=>a+ +i.amount,0), paid=inv.filter(i=>i.status==='paid').reduce((a,i)=>a+ +i.amount,0);
  let finTile='';
  if(ME.role==='admin'){await finLoad();const fd=finYearData(new Date().getFullYear());finTile=`<div class="card stat" style="cursor:pointer" onclick="go('Financials')"><b>${fm(fd.revT)}</b>${new Date().getFullYear()} revenue</div>`}
  const T=(t,f,v,l)=>`<div class="card stat" style="cursor:pointer" onclick='goF("${t}",${JSON.stringify(f)})'><b>${v}</b>${l}</div>`;
  $('view').innerHTML=`<p style="margin-top:0"><button class="p" onclick="openNewLead()">+ New lead</button></p><div class="grid">
   ${T('Leads',{status:'new'},n('new'),'New leads')}${T('Quotes',{status:'sent'},qs.filter(x=>x.status==='sent').length,'Quotes out')}
   ${T('Contracts',{status:'sent'},cons.filter(c=>c.status==='sent').length,'Awaiting signature')}${T('Invoices',{status:'unpaid'},money(owed),'Unpaid invoices')}${T('Invoices',{status:'paid'},money(paid),'Collected')}
   ${T('Tasks',{},tasks.length,'Open tasks')}${finTile}</div>
   <h3>Upcoming events</h3>${evTable(events)}`;
}
const evTable=ev=>ev.length?`<table><tr><th>Event</th><th>Dates</th><th>Where</th><th>Team</th><th>Status</th></tr>${ev.map(e=>`<tr style="cursor:pointer" onclick="openEvent('${e.id}')"><td>${esc(e.name)}</td><td>${fmtDate(e.start_date)} – ${fmtDate(e.end_date)}${e.schedule&&e.schedule.length?`<br><span class="muted">${esc(Schedule.format(e.schedule))}</span>`:''}</td><td>${esc(e.city||e.venue)}</td><td>${esc((e.event_staff||[]).map(x=>x.employees&&x.employees.name).filter(Boolean).join(', '))}</td><td>${pill(e.status)}</td></tr>`).join('')}</table>`:'<p class="muted">Nothing yet.</p>';

const chips=(t,opts,cur)=>`<p>${['all',...opts].map(o=>`<button class="s" style="${(cur||'all')===o?'background:var(--barn);color:#fff':''}" onclick='goF("${t}",${JSON.stringify(o==='all'?{}:{status:o})})'>${o}</button>`).join(' ')}</p>`;
async function Leads(){
  let qy=sb.from('leads').select('*').order('created_at',{ascending:false});if(filt.status)qy=qy.eq('status',filt.status);
  const leads=await q(qy);
  $('view').innerHTML=`<h2>Leads <button class="p" style="float:right" onclick="openNewLead()">+ New lead</button></h2>${chips('Leads',['new','contacted','quoted','won','lost'],filt.status)}${leads.length?`<table><tr><th>Received</th><th>Who</th><th>Interest</th><th>Status</th></tr>${leads.map(l=>`<tr style="cursor:pointer" onclick="openLead('${l.id}')">
   <td>${fmtDate(l.created_at)}</td><td><b>${esc(l.name)}</b><br>${esc(l.organization)}<br>${esc(l.email)} ${l.phone?`· ${esc(l.phone)}`:''}</td>
   <td>${esc(l.event_dates)}<br>${esc(l.booths_interest)}<br><span class="muted">${esc((l.message||'').slice(0,90))}</span></td>
   <td>${pill(l.status)}</td></tr>`).join('')}</table>`:'<p class="muted">No leads here.</p>'}`;
}
async function openLead(id){
  const {data:l}=await sb.from('leads').select('*').eq('id',id).single();
  const acts=await q(sb.from('activities').select('*').eq('lead_id',id).order('created_at',{ascending:false}));
  const f=(k,lab,type)=>`<div><label>${lab}</label><input id="l_${k}" type="${type||'text'}" value="${esc(l[k])}"></div>`;
  $('dlg').innerHTML=`<h2>${esc(l.name)}</h2><p class="muted">Received ${fmtDate(l.created_at)}${l.phone?` · <a href="${telHref(l.phone)}">Call</a> · <a href="${smsHref(l.phone)}">Text</a>`:''}${l.email?` · <a href="mailto:${esc(l.email)}">Email</a>`:''}</p>
   <div class="row">${f('name','Name')}${f('organization','Organization')}${f('email','Email','email')}${f('phone','Phone')}${f('event_dates','Event dates')}${f('booths_interest','Booths interested in')}
   <div><label>Status</label><select id="l_status">${['new','contacted','quoted','won','lost'].map(x=>`<option ${x===l.status?'selected':''}>${x}</option>`).join('')}</select></div></div>
   <label>Message</label><textarea id="l_message" rows="4">${esc(l.message)}</textarea>
   <p><button class="p" onclick="saveLead('${id}')">Save</button> ${l.event_id?`<button class="s" onclick="openEvent('${l.event_id}')">Open event</button>`:`<button class="s" onclick="leadToEvent('${id}')">→ Make event</button>`} <button class="s" onclick="$('dlg').close()">Close</button></p>
   <h3>Notes</h3><textarea id="newnote" rows="2" placeholder="Add a note…"></textarea><button class="s" onclick="addLeadNote('${id}')">Add</button>
   ${acts.map(a=>`<p class="muted">${fmtDate(a.created_at)} · ${esc(a.created_by)}: ${esc(a.body)}</p>`).join('')}`;
  $('dlg').showModal();
}
function openNewLead(){
  const f=(k,l,t)=>`<div><label>${l}</label><input id="nl_${k}" type="${t||'text'}"></div>`;
  $('dlg').innerHTML=`<h2>New lead</h2><div class="row">${f('name','Name *')}${f('organization','Fair / organization')}${f('email','Email','email')}${f('phone','Phone')}${f('event_dates','Event dates')}${f('booths_interest','Booths interested in')}</div>
   <label>Notes</label><textarea id="nl_message" rows="3"></textarea><p id="nl_err" class="err"></p>
   <p><button class="p" onclick="createLead()">Save lead</button> <button class="s" onclick="$('dlg').close()">Cancel</button></p>`;
  $('dlg').showModal();
}
async function createLead(){
  const v=k=>$('nl_'+k).value.trim()||null, name=v('name'), email=v('email');
  if(!name)return $('nl_err').textContent='Name is required.';
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return $('nl_err').textContent='That email address doesn\'t look right.';
  const {error}=await sb.from('leads').insert({name,organization:v('organization'),email,phone:v('phone'),event_dates:v('event_dates'),booths_interest:v('booths_interest'),message:v('message'),source:'crm'});
  if(error)return $('nl_err').textContent=error.message;
  $('dlg').close();go(tab==='Dashboard'?'Leads':tab);
}
async function saveLead(id){
  const v=k=>$('l_'+k).value.trim()||null;
  await q(sb.from('leads').update({name:v('name'),organization:v('organization'),email:v('email'),phone:v('phone'),event_dates:v('event_dates'),booths_interest:v('booths_interest'),message:v('message'),status:$('l_status').value}).eq('id',id));
  $('dlg').close();go(tab);
}
async function addLeadNote(id){const b=$('newnote').value.trim();if(!b)return;await q(sb.from('activities').insert({lead_id:id,body:b,created_by:ME.name}));openLead(id)}
async function leadToEvent(id){
  const {data:l}=await sb.from('leads').select('*').eq('id',id).single();
  const [org]=await q(sb.from('organizations').insert({name:l.organization||l.name,phone:l.phone}).select());
  const [c]=await q(sb.from('contacts').insert({organization_id:org?.id,name:l.name,email:l.email,phone:l.phone}).select());
  const [ev]=await q(sb.from('events').insert({name:(l.organization||l.name)+' event',organization_id:org?.id,contact_id:c?.id,notes:l.message}).select());
  if(ev){await q(sb.from('leads').update({contact_id:c?.id,event_id:ev.id,status:'quoted'}).eq('id',id));openEvent(ev.id)}
}

let evView='list', calY=new Date().getFullYear(), calM=new Date().getMonth();
const pad=n=>String(n).padStart(2,'0');
function calShift(d){calM+=d;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}Events()}
function calToday(){const n=new Date();calY=n.getFullYear();calM=n.getMonth();Events()}
function setEvView(v){evView=v;Events()}
function calGrid(ev){
  const first=new Date(calY,calM,1), dim=new Date(calY,calM+1,0).getDate(), cells=[];
  for(let i=0;i<first.getDay();i++)cells.push(0);for(let d=1;d<=dim;d++)cells.push(d);while(cells.length%7)cells.push(0);
  const now=new Date(), todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const live=ev.filter(e=>e.start_date&&e.status!=='cancelled');
  const body=cells.map(d=>{
    if(!d)return '<div class="cal-d off"></div>';
    const key=`${calY}-${pad(calM+1)}-${pad(d)}`, here=live.filter(e=>e.start_date<=key&&(e.end_date||e.start_date)>=key);
    return `<div class="cal-d${key===todayKey?' today':''}"><span class="n">${d}</span>${here.map(e=>`<div class="chip ${esc(e.status)}" onclick="openEvent('${e.id}')" title="${esc(e.name)} (${esc(e.status)})${e.schedule&&e.schedule.length?' — '+esc(Schedule.format(e.schedule)):''}">${esc(e.name)}</div>`).join('')}</div>`}).join('');
  const undated=ev.filter(e=>!e.start_date&&e.status!=='cancelled');
  return `<p><button class="s" onclick="calShift(-1)">◀</button> <b style="display:inline-block;min-width:150px;text-align:center">${first.toLocaleString('en-US',{month:'long',year:'numeric'})}</b> <button class="s" onclick="calShift(1)">▶</button> <button class="s" onclick="calToday()">Today</button>
   <span class="muted"> &nbsp;<span class="pill tentative">tentative</span> <span class="pill confirmed">confirmed</span> <span class="pill completed">completed</span></span></p>
   <div class="cal">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="cal-h">${x}</div>`).join('')}${body}</div>
   ${undated.length?`<p class="muted">No dates yet: ${undated.map(e=>`<a href="#" onclick="openEvent('${e.id}');return false">${esc(e.name)}</a>`).join(', ')}</p>`:''}`;
}
let evMine=false;
function setEvMine(v){evMine=v;Events()}
async function Events(){
  let ev=await q(sb.from('events').select('*, event_staff(employee_id, employees(name))').order('start_date',{ascending:evView==='cal'}));
  if(evMine)ev=ev.filter(e=>(e.event_staff||[]).some(x=>x.employee_id===ME.id));
  $('view').innerHTML=`<h2>Events <span class="tog" style="margin-left:10px;font-size:14px"><button class="s ${evView==='list'?'on':''}" onclick="setEvView('list')">List</button><button class="s ${evView==='cal'?'on':''}" onclick="setEvView('cal')">Calendar</button></span> <span class="tog" style="margin-left:6px;font-size:14px"><button class="s ${!evMine?'on':''}" onclick="setEvMine(false)">All</button><button class="s ${evMine?'on':''}" onclick="setEvMine(true)">Assigned to me</button></span> <button class="p" style="float:right" onclick="newEvent()">+ New event</button></h2>${evView==='cal'?calGrid(ev):evTable(ev)}`;
}
async function newEvent(oid,cid){const [e]=await q(sb.from('events').insert({name:'New event',organization_id:oid||null,contact_id:cid||null}).select());if(e)openEvent(e.id)}
async function openEvent(id){
  const {data:e}=await sb.from('events').select('*').eq('id',id).single();
  const [staffAll,staffSel,orgs,contacts,cons,quotes,inv,acts,sel]=await Promise.all([q(sb.from('employees').select('id,name').eq('status','active').order('name')),q(sb.from('event_staff').select('employee_id').eq('event_id',id)),q(sb.from('organizations').select('id,name').order('name')),q(sb.from('contacts').select('id,name,organization_id').order('name')),q(sb.from('contracts').select('id,status,title,sent_at,signed_at,signed_name').eq('event_id',id).order('created_at',{ascending:false})),q(sb.from('quotes').select('*').eq('event_id',id).order('created_at',{ascending:false})),q(sb.from('invoices').select('*').eq('event_id',id)),q(sb.from('activities').select('*').eq('event_id',id).order('created_at',{ascending:false})),q(sb.from('event_attractions').select('attraction_id').eq('event_id',id))]);
  const picked=new Set(sel.map(s=>s.attraction_id)), crew=new Set(staffSel.map(s=>s.employee_id)), days=daysBetween(e.start_date,e.end_date)||1;
  const d=$('dlg');d.innerHTML=`<h2>${esc(e.name)}</h2>
   <div class="row"><div><label>Name</label><input id="e_name" value="${esc(e.name)}"></div><div><label>Status</label><select id="e_status">${['tentative','confirmed','completed','cancelled'].map(s=>`<option ${s===e.status?'selected':''}>${s}</option>`).join('')}</select></div>
   <div><label>Customer</label><select id="e_org" onchange="fillContacts()"><option value="">–</option>${orgs.map(o=>`<option value="${o.id}" ${o.id===e.organization_id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div>
   <div><label>Contact</label><select id="e_contact"></select></div>
   <div><label>Start</label><input id="e_start" type="date" onchange="qbPreview()" value="${e.start_date||''}"></div><div><label>End</label><input id="e_end" type="date" onchange="qbPreview()" value="${e.end_date||''}"></div>
   <div><label>Venue</label><input id="e_venue" value="${esc(e.venue)}"></div><div><label>City</label><input id="e_city" value="${esc(e.city)}"></div>
   <div><label>Booths</label><select id="e_booths" onchange="qbPreview()"><option value="">–</option>${[4,6,8,10].map(b=>`<option ${b==e.booths?'selected':''}>${b}</option>`).join('')}</select></div>
   <div><label>Craft station</label><select id="e_craft" onchange="qbPreview()"><option value="false">No</option><option value="true" ${e.craft_station?'selected':''}>Yes</option></select></div></div>
   <label>Times — one line per day, e.g. <i>2026-10-21 4pm-10pm</i> <a href="#" style="font-weight:400" onclick="evSchedFill();return false">fill from dates + the times note</a></label><textarea id="e_sched" rows="3">${esc(Schedule.toLines(e.schedule))}</textarea>
   <div class="row"><div><label>Times note</label><input id="e_times" value="${esc(e.times_text)}" placeholder="e.g. Wed–Thu 4pm–10pm, Fri–Sat 4pm–12am"></div></div>
   <label>Load-in / notes</label><textarea id="e_notes" rows="3">${esc(e.load_in_notes||e.notes)}</textarea>
   <label>Assigned team</label><div class="row">${staffAll.map(m=>`<label style="font-weight:400"><input type="checkbox" style="width:auto" class="stf" value="${m.id}" ${crew.has(m.id)?'checked':''}> ${esc(m.name)}</label>`).join('')||'<span class="muted">No team members yet.</span>'}</div>

function qbCalc(){
  const booths=+$('e_booths').value, days=daysBetween($('e_start').value,$('e_end').value)||window._qbDays||1;
  if(!booths)return null;
  const craft=$('e_craft').value==='true', travel=+$('qb_travel').value||0;
  const r=FarmPricing.quote({booths,days,craft,travelFee:travel}), sub=r.total, dv=+$('qb_disc').value||0;
  const disc=Math.min(sub,$('qb_dtype').value==='pct'?Math.round(sub*dv)/100:dv), total=Math.round((sub-disc)*100)/100;
  return {booths,days,craft,travel,r,sub,disc,total};
}

const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const loadScript=src=>new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const el=document.createElement('script');el.src=src;el.onload=res;el.onerror=()=>rej(new Error('Could not load the PDF reader — check your connection and try again.'));document.head.appendChild(el)});

async function readContractPdf(inp){
  const f=inp.files&&inp.files[0];if(!f)return;

  try{
    await loadScript(PDFJS+'pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'pdf.worker.min.js';
    const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;let lines=[];
    for(let i=1;i<=doc.numPages;i++){const tc=await (await doc.getPage(i)).getTextContent();lines=lines.concat(ContractImport.itemsToLines(tc.items))}
    if(lines.join(' ').length<80){$('dlg').close();return alert('This PDF has no readable text (it may be a scan or photo). Use New contract on an event instead, or upload a PDF saved from a computer.')}

// ---------- Financials (admins only): revenue by month/year, cash received, receivables.
// Modeled on the AllStar Moonwalks reports (Revenue by Month, Annual Revenue, Monthly Payments, Receivables).
// Revenue = value of booked (confirmed/completed) events: the signed contract total, else the accepted quote, else the latest quote.
// It is recognized on the event days (a multi-day event is split across the months it runs). Tentative events show as pipeline.
let finYear=new Date().getFullYear(), finTab='overview', FIN=null;
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
async function finLoad(){
  const [events,quotes,contracts,invoices,payments,orgs]=await Promise.all([q(sb.from('events').select('id,name,start_date,end_date,status,organization_id')),q(sb.from('quotes').select('event_id,total,status,created_at')),q(sb.from('contracts').select('event_id,status,terms,signed_at')),q(sb.from('invoices').select('id,event_id,number,kind,amount,status,due_date')),q(sb.from('payments').select('*')),q(sb.from('organizations').select('id,name'))]);
  const org=Object.fromEntries(orgs.map(o=>[o.id,o.name])), inv=Object.fromEntries(invoices.map(i=>[i.id,i])), evById=Object.fromEntries(events.map(e=>[e.id,e]));
  const value=e=>{
    const c=contracts.filter(x=>x.event_id===e.id&&x.status==='signed'&&x.terms&&+x.terms.total).sort((a,b)=>String(b.signed_at).localeCompare(String(a.signed_at)))[0];if(c)return +c.terms.total;
    const qs=quotes.filter(x=>x.event_id===e.id&&x.status!=='declined').sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))), acc=qs.find(x=>x.status==='accepted');
    if(acc)return +acc.total;return qs[0]?+qs[0].total:0};
  const booked=events.filter(e=>(e.status==='confirmed'||e.status==='completed')&&e.start_date).map(e=>({...e,value:value(e),org:org[e.organization_id]||''}));
  const pipeline=events.filter(e=>e.status==='tentative').map(e=>({...e,value:value(e),org:org[e.organization_id]||''})).filter(e=>e.value>0);
  const paid=payments.map(p=>({...p,amount:+p.amount,inv:inv[p.invoice_id],ev:evById[p.event_id]}));
  FIN={booked,pipeline,paid,invoices,org,evById};
}
// revenue per YYYY-MM for one event, split by the days that fall in each month
function spreadRevenue(e){
  const out={}, a=new Date(e.start_date+'T12:00:00'), b=new Date((e.end_date||e.start_date)+'T12:00:00'), n=Math.min(400,Math.max(1,Math.round((b-a)/864e5)+1));
  for(let i=0;i<n;i++){const d=new Date(a);d.setDate(a.getDate()+i);const k=d.getFullYear()+'-'+pad(d.getMonth()+1);out[k]=(out[k]||0)+e.value/n}
  return out;
}
function finYearData(y){
  const rev=Array(12).fill(0), cnt=Array(12).fill(0), rec=Array(12).fill(0), dep=Array(12).fill(0), bal=Array(12).fill(0), inMonth=Array(12).fill(0);
  FIN.booked.forEach(e=>{const sp=spreadRevenue(e);for(let m=0;m<12;m++)rev[m]+=sp[y+'-'+pad(m+1)]||0;if(+e.start_date.slice(0,4)===y)cnt[+e.start_date.slice(5,7)-1]++});
  FIN.paid.forEach(p=>{if(!p.paid_at||+p.paid_at.slice(0,4)!==y)return;const m=+p.paid_at.slice(5,7)-1;rec[m]+=p.amount;
    if(p.inv&&p.inv.kind==='deposit')dep[m]+=p.amount;else bal[m]+=p.amount;
    if(p.ev&&p.ev.start_date&&p.ev.start_date.slice(0,7)===p.paid_at.slice(0,7))inMonth[m]+=p.amount});
  const sum=a=>a.reduce((x,y2)=>x+y2,0);
  return {rev,cnt,rec,dep,bal,inMonth,revT:sum(rev),cntT:sum(cnt),recT:sum(rec),depT:sum(dep),balT:sum(bal),inT:sum(inMonth)};
}
const fm=n=>'$'+Math.round(n).toLocaleString('en-US');
function finDrawChart(cv,labels,a,b){
  const W=cv.parentElement.clientWidth||600,H=240;cv.width=W;cv.height=H;const g=cv.getContext('2d'),pd={t:14,r:10,b:30,l:48},cw=W-pd.l-pd.r,ch=H-pd.t-pd.b,max=Math.max(...a,...b,1);g.clearRect(0,0,W,H);
  g.strokeStyle='#e8dcc0';g.fillStyle='#7a6a45';g.font='10px system-ui';g.textAlign='right';
  for(let i=0;i<=4;i++){const y=pd.t+ch*(1-i/4);g.beginPath();g.moveTo(pd.l,y);g.lineTo(W-pd.r,y);g.stroke();g.fillText('$'+(max*i/4/1000).toFixed(max>=4000?0:1)+'k',pd.l-4,y+3)}
  const gap=cw/labels.length,bw=gap*0.34;
  labels.forEach((l,i)=>{const x=pd.l+gap*i+gap*0.12;
    [[a[i],'#a8321f'],[b[i],'#3f6b2f']].forEach(([v,c],k)=>{const h=ch*v/max;g.fillStyle=c;g.fillRect(x+k*(bw+2),pd.t+ch-h,bw,h)});
    g.fillStyle='#6b4a2b';g.textAlign='center';g.fillText(l,x+bw,H-12)});
}

  $('view').innerHTML=`<h2>Team <button class="p" style="float:right" onclick="newMember()">+ Add team member</button></h2>
   <p class="muted">People here can sign in to this CRM and the crew app. Inactive people can't sign in.</p>
   <table><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Status</th></tr>${emps.map(e=>`<tr style="cursor:pointer" onclick="openMember('${e.id}')"><td><b>${esc(e.name)}</b>${e.id===ME.id?' <span class="muted">(you)</span>':''}</td><td>${esc(e.email)}</td><td>${esc(e.role)}</td><td>${esc(e.phone)}</td><td><span class="pill ${e.status==='active'?'confirmed':'cancelled'}">${esc(e.status)}</span></td></tr>`).join('')}</table>`;
}
const roleOpts=cur=>['admin','manager','crew'].map(r=>`<option value="${r}" ${r===cur?'selected':''}>${r} — ${ROLE_HELP[r]}</option>`).join('');
function newMember(){
  $('dlg').innerHTML=`<h2>Add team member</h2><div class="row"><div><label>Name</label><input id="m_name"></div><div><label>Email (their login)</label><input id="m_email" type="email"></div>
   <div><label>Phone</label><input id="m_phone"></div><div><label>Role</label><select id="m_role">${roleOpts('crew')}</select></div></div>
   <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" id="m_invite" style="width:auto" checked> Email them a link to choose their own password</label>
   <p class="muted">Or set a temporary password now instead (they can change it after signing in):</p><input id="m_pw" type="text" placeholder="Optional temporary password (8+ characters)" autocomplete="off">
   <p id="m_err" class="err"></p><p><button class="p" id="m_go" onclick="saveNewMember()">Add</button> <button class="s" onclick="$('dlg').close()">Cancel</button></p>`;
  $('dlg').showModal();
}
async function saveNewMember(){
  const b=$('m_go'),pw=$('m_pw').value.trim();$('m_err').textContent='';b.disabled=true;b.textContent='Adding…';
  try{
    const r=await staffFn({action:'create',name:$('m_name').value,email:$('m_email').value,role:$('m_role').value,phone:$('m_phone').value,send_invite:$('m_invite').checked,password:pw||undefined});
    let msg=r.emailed?'Added. A password link was emailed to them.':'Added.';
    if(r.email_error)msg+='\n\nThe email did not send: '+r.email_error+'\nUse "Email password link" on their record to try again.';
    if(pw)msg+='\n\nTemporary password: '+pw;
    if(r.existing_login)msg+='\n\nNote: this email already had a login (e.g. a customer portal login); it keeps its current password.';
    alert(msg);$('dlg').close();Team();
  }catch(x){$('m_err').textContent=x.message;b.disabled=false;b.textContent='Add'}
}
async function openMember(id){
  const {data:e}=await sb.from('employees').select('*').eq('id',id).single();const me=e.id===ME.id;
  $('dlg').innerHTML=`<h2>${esc(e.name)}</h2><p class="muted">${esc(e.email)}${me?' · this is you':''}</p>
   <div class="row"><div><label>Name</label><input id="m_name" value="${esc(e.name)}"></div><div><label>Phone</label><input id="m_phone" value="${esc(e.phone)}"></div>
   <div><label>Role</label><select id="m_role" ${me?'disabled':''}>${roleOpts(e.role)}</select></div>
   <div><label>Status</label><select id="m_status" ${me?'disabled':''}><option ${e.status==='active'?'selected':''}>active</option><option ${e.status==='inactive'?'selected':''}>inactive</option></select></div></div>
   ${me?'<p class="muted">You can\'t change your own role or status (so the team can\'t be left without an admin).</p>':''}
   <p><button class="p" onclick="saveMember('${id}')">Save</button> <button class="s" onclick="$('dlg').close()">Close</button></p>
   <h3>Sign-in</h3><p><button class="s" onclick="memberInvite('${id}')">✉ Email password link</button> <button class="s" onclick="memberTempPw('${id}')">🔑 Set temporary password</button></p>
   <p class="muted">The email link lets them choose their own password. A temporary password is shown once, for you to pass on.</p>`;
  $('dlg').showModal();
}
async function saveMember(id){
  const me=id===ME.id,row={name:$('m_name').value.trim(),phone:$('m_phone').value.trim()||null};
  if(!row.name){alert('Name is required.');return}
  if(!me){row.role=$('m_role').value;row.status=$('m_status').value}
  const {error}=await sb.from('employees').update(row).eq('id',id);if(error)return alert(error.message);
  $('dlg').close();Team();
}
async function memberInvite(id){
  if(!confirm('Email this person a link to set their password?'))return;
  try{const r=await staffFn({action:'invite',employee_id:id});alert('Password link emailed to '+r.to+'.')}catch(x){alert('Not sent: '+x.message)}
}
async function memberTempPw(id){
  if(!confirm('Set a new temporary password? Their current password will stop working.'))return;
  try{const r=await staffFn({action:'set_password',employee_id:id});prompt('Temporary password (shown once — copy it and pass it on):',r.password)}catch(x){alert('Not changed: '+x.message)}
}
async function Tasks(){
  const t=await q(sb.from('tasks').select('*').order('done').order('due_date'));
  $('view').innerHTML=`<h2>Tasks</h2><p><input id="tt" placeholder="New task…" style="max-width:340px"> <input id="td" type="date" style="max-width:160px"> <button class="p" onclick="addTask()">Add</button></p>
   ${t.map(x=>`<p><label style="font-weight:400"><input type="checkbox" style="width:auto" ${x.done?'checked':''} onchange="tick('${x.id}',this.checked)"> ${esc(x.title)} <span class="muted">${fmtDate(x.due_date)}</span></label></p>`).join('')}`;
}
async function addTask(){const title=$('tt').value.trim();if(!title)return;await q(sb.from('tasks').insert({title,due_date:$('td').value||null}));Tasks()}
async function tick(id,done){await q(sb.from('tasks').update({done}).eq('id',id))}
$('ccss').textContent=ContractDoc.CSS;
boot();
</script></body></html>
