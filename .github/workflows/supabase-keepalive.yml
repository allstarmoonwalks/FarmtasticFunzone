# Keeps the free-tier Supabase project from auto-pausing after ~7 days of inactivity.
# Calls a harmless database function (public.keepalive(), returns now()) every 3 days.
# The URL and publishable key below are public values (the same ones in shared/supabase-config.js).
# Note: GitHub disables scheduled workflows after 60 days with no repo activity; any push re-enables them.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        env:
          SUPABASE_URL: https://ciydqepqhqfqhptpqily.supabase.co
          SUPABASE_KEY: sb_publishable_nun1X7mbN_Rgv2_sXkG2lQ_WtF6AP2f
        run: |
          set -euo pipefail
          resp=$(curl -sS --fail-with-body --retry 3 --retry-delay 10 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase responded: $resp"
