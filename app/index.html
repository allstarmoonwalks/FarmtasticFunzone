<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#6b4a2b">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml"><link rel="icon" href="/favicon.ico?v=2" sizes="any"><link rel="apple-touch-icon" href="/images/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Farmtastic Crew</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cream:#fbf3e0;--ink:#2b200a;--barn:#a8321f;--wood:#6b4a2b;--line:#d9c9a0}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,sans-serif;background:var(--cream);color:var(--ink);padding-bottom:70px}
header{background:var(--wood);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;justify-content:space-between}
main{padding:14px;max-width:640px;margin:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.pill{font-size:12px;background:#f1e4c3;border-radius:99px;padding:2px 8px}
.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
a.b,button.b{background:var(--barn);color:#fff;border:0;border-radius:10px;padding:10px 14px;text-decoration:none;font:inherit;font-weight:600}
a.b.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:14px 0;font:inherit;font-weight:600}nav button.on{color:var(--barn)}
input,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin:4px 0}
.seg{display:flex;margin-bottom:12px}.seg button{flex:1;border:1px solid var(--line);background:#fff;padding:10px 4px;font:inherit;font-weight:600;color:var(--ink)}
.seg button:first-child{border-radius:10px 0 0 10px}.seg button:last-child{border-radius:0 10px 10px 0}.seg button.on{background:var(--barn);border-color:var(--barn);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}.ch{font-size:11px;font-weight:700;text-align:center;color:#7a6a45}
.cd{background:#fff;border:1px solid var(--line);border-radius:8px;min-height:52px;padding:3px 0;font-size:13px;text-align:center;cursor:pointer}.cd.off{visibility:hidden}.cd.sel{outline:2px solid var(--barn)}.cd.today{background:#fff0c2}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin:1px}.dot.confirmed{background:#3f6b2f}.dot.tentative{background:#d99a1e}.dot.completed{background:#999}.dot.mine{box-shadow:0 0 0 2px #a8321f}
.muted{color:#7a6a45;font-size:14px}.err{color:var(--barn)}
</style></head><body>
<header><b>🌾 Farmtastic Crew</b><span id="who"></span></header>
<main id="view"><p class="muted">Loading…</p></main>
<nav id="nav" hidden><button data-t="today" class="on">Events</button><button data-t="leads">Leads</button><button data-t="tasks">Tasks</button><button data-t="me">Me</button></nav>
<script src="../shared/supabase-config.js"></script>
<script src="../shared/schedule.js"></script>
<script src="../shared/crm-core.js"></script>
<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const $=id=>document.getElementById(id);let ME=null;
const rows=async p=>{const {data,error}=await p;if(error){$('view').insertAdjacentHTML('afterbegin',`<p class="err">${esc(error.message)}</p>`);return[]}return data||[]};
async function boot(){
  const r=await requireStaff();
  if(!r||r.error==='config'){$('view').innerHTML=`<form class="card" onsubmit="login(event)"><h3>Crew sign in</h3>${r?.error==='config'?'<p class="err">Not configured yet (shared/supabase-config.js).</p>':''}<input id="em" type="email" placeholder="Email" required><input id="pw" type="password" placeholder="Password" required><p id="le" class="err">${esc(urlAuthError)}</p><button class="b">Sign in</button> <button type="button" class="b alt" style="border:1px solid #d9c9a0;background:#fff;color:#2b200a" onclick="doReset()">Forgot / set password</button></form>`;return}
  if(r.error==='not-staff'){$('view').innerHTML=`<div class="card"><h3>No crew access</h3><p>${esc(r.user.email)} isn't an active crew member.</p><button class="b" onclick="signOut()">Sign out</button></div>`;return}
  ME=r.employee;$('who').textContent=ME.name;$('nav').hidden=false;
  $('nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===e.target));({today,leads,tasks,me})[t]()};
  today();
}
async function doReset(){try{await resetPassword($('em').value);$('le').style.color='#3f6b2f';$('le').textContent='Check your email for a link.'}catch(x){$('le').textContent=x.message}}
async function login(e){e.preventDefault();try{await signIn($('em').value,$('pw').value);location.reload()}catch(x){$('le').textContent=x.message}}
let evMode='mine', calY=new Date().getFullYear(), calM=new Date().getMonth(), calSel=null, EV=[], STAFF=[];
const EVSEL='*, event_attractions(attractions(name)), event_staff(employee_id, employees(name))';
const pad=n=>String(n).padStart(2,'0'), isoDay=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const mine=e=>(e.event_staff||[]).some(x=>x.employee_id===ME.id);
async function today(){
  const [ev,staff]=await Promise.all([rows(sb.from('events').select(EVSEL).neq('status','cancelled').order('start_date')),rows(sb.from('employees').select('id,name').eq('status','active').order('name'))]);
  EV=ev;STAFF=staff;drawEvents();
}
function setMode(m){evMode=m;drawEvents()}
function evCard(e){
  const team=(e.event_staff||[]).map(x=>esc(x.employees&&x.employees.name)).filter(Boolean).join(', ');
  return `<div class="card"><b>${esc(e.name)}</b> <span class="pill">${esc(e.status)}</span>${mine(e)?' <span class="pill" style="background:#d8ecd0">assigned to me</span>':''}<br>${fmtDate(e.start_date)} – ${fmtDate(e.end_date)}${(e.schedule&&e.schedule.length)||e.times_text?`<br>🕓 ${esc(e.schedule&&e.schedule.length?Schedule.format(e.schedule):e.times_text)}`:''}<br>${esc([e.venue,e.city].filter(Boolean).join(', '))}
   ${e.address?`<div class="btns"><a class="b alt" href="https://maps.google.com/?q=${encodeURIComponent(e.address+' '+(e.city||''))}">Directions</a></div>`:''}
   ${e.load_in_notes?`<p class="muted">${esc(e.load_in_notes)}</p>`:''}
   <p class="muted">${(e.event_attractions||[]).map(x=>esc(x.attractions&&x.attractions.name)).join(' · ')}</p>
   <p class="muted"><b>Team:</b> ${team||'no one assigned yet'}</p>
   <div class="btns"><button class="b alt" onclick="toggleMe('${e.id}')">${mine(e)?'✓ I\'m on this — tap to leave':'＋ Assign me'}</button><button class="b alt" onclick="editTeam('${e.id}')">Edit team</button></div><div id="tm_${e.id}"></div></div>`;
}
function calHtml(){
  const first=new Date(calY,calM,1), dim=new Date(calY,calM+1,0).getDate(), td=isoDay(new Date()), cells=[];
  for(let i=0;i<first.getDay();i++)cells.push(0);for(let d=1;d<=dim;d++)cells.push(d);while(cells.length%7)cells.push(0);
  const live=EV.filter(e=>e.start_date);
  const body=cells.map(d=>{
    if(!d)return '<div class="cd off"></div>';
    const key=`${calY}-${pad(calM+1)}-${pad(d)}`, here=live.filter(e=>e.start_date<=key&&(e.end_date||e.start_date)>=key);
    return `<div class="cd${key===calSel?' sel':''}${key===td?' today':''}" onclick="pickDay('${key}')">${d}<br>${here.slice(0,4).map(e=>`<span class="dot ${esc(e.status)}${mine(e)?' mine':''}"></span>`).join('')}</div>`}).join('');
  const day=calSel?EV.filter(e=>e.start_date&&e.start_date<=calSel&&(e.end_date||e.start_date)>=calSel):[];
  return `<div class="btns" style="justify-content:space-between;align-items:center;margin:0 0 8px"><button class="b alt" onclick="calShift(-1)">◀</button><b>${first.toLocaleString('en-US',{month:'long',year:'numeric'})}</b><button class="b alt" onclick="calShift(1)">▶</button></div>
   <div class="cal">${['S','M','T','W','T','F','S'].map(x=>`<div class="ch">${x}</div>`).join('')}${body}</div>
   <p class="muted"><span class="dot confirmed"></span> confirmed <span class="dot tentative"></span> tentative <span class="dot completed"></span> completed · red ring = assigned to me</p>
   ${calSel?(day.length?day.map(evCard).join(''):`<p class="muted">Nothing on ${fmtDate(calSel)}.</p>`):'<p class="muted">Tap a day to see its events.</p>'}`;
}
function calShift(d){calM+=d;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}calSel=null;drawEvents()}
function pickDay(k){calSel=k;drawEvents()}
function drawEvents(){
  const d=isoDay(new Date()), upcoming=EV.filter(e=>!e.end_date&&!e.start_date||(e.end_date||e.start_date)>=d);
  if(evMode==='cal'&&!calSel&&calY===new Date().getFullYear()&&calM===new Date().getMonth())calSel=d;
  const seg=`<div class="seg"><button class="${evMode==='mine'?'on':''}" onclick="setMode('mine')">Assigned to me</button><button class="${evMode==='all'?'on':''}" onclick="setMode('all')">All events</button><button class="${evMode==='cal'?'on':''}" onclick="setMode('cal')">Calendar</button></div>`;
  let body;
  if(evMode==='cal')body=calHtml();
  else if(evMode==='mine'){const m=upcoming.filter(mine);body=m.length?m.map(evCard).join(''):`<div class="card"><p>No upcoming events are assigned to you yet.</p><button class="b" onclick="setMode('all')">See all events</button></div>`}
  else body=upcoming.map(evCard).join('')||'<p class="muted">No upcoming events.</p>';
  $('view').innerHTML=seg+body;
}
function editTeam(id){
  const e=EV.find(x=>x.id===id), cur=new Set((e.event_staff||[]).map(x=>x.employee_id));
  $('tm_'+id).innerHTML=`<div style="margin-top:8px">${STAFF.map(m=>`<label style="display:block;padding:4px 0"><input type="checkbox" class="tm_${id}" value="${m.id}" ${cur.has(m.id)?'checked':''} style="width:auto"> ${esc(m.name)}</label>`).join('')}</div>
   <div class="btns"><button class="b" onclick="saveTeam('${id}')">Save team</button><button class="b alt" onclick="drawEvents()">Cancel</button></div>`;
}
async function setTeam(id,ids){
  await rows(sb.from('event_staff').delete().eq('event_id',id));
  if(ids.length)await rows(sb.from('event_staff').insert(ids.map(i=>({event_id:id,employee_id:i}))));
  await today();
}
const saveTeam=id=>setTeam(id,[...document.querySelectorAll('.tm_'+id+':checked')].map(c=>c.value));
function toggleMe(id){
  const e=EV.find(x=>x.id===id), ids=new Set((e.event_staff||[]).map(x=>x.employee_id));
  mine(e)?ids.delete(ME.id):ids.add(ME.id);return setTeam(id,[...ids]);
}
async function leads(){
  const l=await rows(sb.from('leads').select('*').in('status',['new','contacted']).order('created_at',{ascending:false}));
  $('view').innerHTML=`<div class="card"><b>Quick add lead</b><input id="ln" placeholder="Name"><input id="lp" type="tel" placeholder="Phone"><input id="le2" type="email" placeholder="Email"><input id="lo" placeholder="Fair / organization"><p id="lerr" class="err"></p><button class="b" onclick="addLead()">Save</button></div>`+
  l.map(x=>`<div class="card"><b>${esc(x.name)}</b> <span class="pill">${esc(x.status)}</span><br>${esc(x.organization)}<br><span class="muted">${esc(x.event_dates)} ${esc(x.booths_interest)}</span>
   <div class="btns">${x.phone?`<a class="b" href="${telHref(x.phone)}">Call</a><a class="b alt" href="${smsHref(x.phone)}">Text</a>`:''}${x.email?`<a class="b alt" href="mailto:${esc(x.email)}">Email</a>`:''}${x.status==='new'?`<button class="b alt" onclick="mark('${x.id}')">Mark contacted</button>`:''}</div></div>`).join('');
}
async function addLead(){
  const name=$('ln').value.trim(), email=$('le2').value.trim();
  if(!name)return $('lerr').textContent='Name is required.';
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return $('lerr').textContent='That email address doesn\'t look right.';
  await rows(sb.from('leads').insert({name,phone:$('lp').value.trim()||null,email:email||null,organization:$('lo').value.trim()||null,source:'app'}));leads();
}
async function mark(id){await rows(sb.from('leads').update({status:'contacted'}).eq('id',id));leads()}
async function tasks(){
  const t=await rows(sb.from('tasks').select('*').eq('done',false).order('due_date'));
  $('view').innerHTML=t.map(x=>`<div class="card"><label><input type="checkbox" onchange="done('${x.id}')" style="width:auto"> ${esc(x.title)}</label> <span class="muted">${fmtDate(x.due_date)}</span></div>`).join('')||'<p class="muted">All caught up.</p>';
}
async function done(id){await rows(sb.from('tasks').update({done:true}).eq('id',id));tasks()}
function me(){$('view').innerHTML=`<div class="card"><b>${esc(ME.name)}</b><br>${esc(ME.email)}<br><span class="pill">${esc(ME.role)}</span><div class="btns"><button class="b" onclick="openChangePassword()">Change password</button> <button class="b" onclick="signOut()">Sign out</button></div><p class="muted">Tip: use Share → Add to Home Screen to install.</p></div>`}
boot();
</script></body></html>
