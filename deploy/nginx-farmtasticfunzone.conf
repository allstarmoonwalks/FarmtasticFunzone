# Farmtastic Fun Zone — nginx server block (replaces Netlify's netlify.toml headers + _redirects).
# Install on the droplet:
#   sudo cp nginx-farmtasticfunzone.conf /etc/nginx/sites-available/farmtasticfunzone
#   sudo ln -s /etc/nginx/sites-available/farmtasticfunzone /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/farmtasticfunzone && sudo chown -R root:root /var/www/farmtasticfunzone
#   sudo nginx -t && sudo systemctl reload nginx
#   (after DNS points here) sudo certbot --nginx -d farmtasticfunzone.com -d www.farmtasticfunzone.com --redirect
# certbot adds the 443 block and the http->https redirect itself. It does not touch the AllStar site.
# NOTE: add_header inside a location stops inheriting server-level add_header, so each location repeats what it needs.

server {
    listen 80;
    listen [::]:80;
    server_name farmtasticfunzone.com www.farmtasticfunzone.com;

    root /var/www/farmtasticfunzone;
    index index.html;
    charset utf-8;

    # non-www -> www (the canonical site; Supabase redirect URLs use www)
    if ($host = farmtasticfunzone.com) { return 301 $scheme://www.farmtasticfunzone.com$request_uri; }

    error_page 404 /404.html;

    # dotfiles (.git, .github, .env) — but allow certbot's ACME challenge
    location ~ /\.(?!well-known) { return 404; }

    # internal docs, source and config: a real 404 (same list as _redirects)
    location ~* ^/(HANDOFF|INSTRUCTIONS|README|CRM)\.md$ { return 404; }
    location ~* ^/(netlify\.toml|_redirects)$           { return 404; }
    location ^~ /supabase/                              { return 404; }
    location ^~ /deploy/                                { return 404; }
    location ~* \.(sql|md|sh|conf|test\.js)$            { return 404; }

    # CRM, crew app, portal and signing page: never indexed, never cached stale
    location ^~ /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /admin/index.html;
    }
    location ^~ /app/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /app/index.html;
    }
    location ^~ /portal/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /portal/index.html;
    }
    location ^~ /sign/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ /sign/index.html;
    }

    # shared scripts must always match the pages that load them
    location ^~ /shared/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # pretty URLs like Netlify: /about -> /about.html
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # images, video and fonts can be cached
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|mp4|webm|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }
}
